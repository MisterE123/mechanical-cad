# Tests readiness only; NEVER publishes artifacts/releases.
name: Release readiness
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Require matching existing version tag
        run: python scripts/check_release_ref.py
      - run: python -m pip install -e ".[dev,sketch]"
      - run: python -m ruff check .
      - run: python -m pytest -q
# Action revision identities verified against official GitHub release commit links.
# These tests are expected to expose existing failures; never continue-on-error.
# Add the separately reviewed standalone build/qualification and publication jobs
# only after the blockers in docs/RELEASE_CANDIDATE_BUILDER.md are closed.
