name: Core regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # The complete suite includes native constrained-sketch contracts.
      # Missing-solver behavior is exercised explicitly by its negative tests.
      - run: python -m pip install -e '.[dev,sketch]'
      - run: python -m ruff check .
      - run: python -m pytest -q
  constrained-sketch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,sketch]'
      - run: python -m pytest -q
# Blender GUI/background integration is a separate release gate. This workflow
# does not qualify standalone packages or publish a release.
