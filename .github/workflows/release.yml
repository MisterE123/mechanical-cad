name: Qualified Linux and Windows release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      commit:
        description: 'Exact full development commit; dispatch never publishes'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: qualified-release-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  # Preserve sealed fixture/source Git blobs on Windows without changing global Git configuration.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  CANDIDATE_COMMIT: ${{ inputs.commit }}
  PYTHONNOUSERSITE: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/check_pipeline_source.py
      - run: python -m pip install -e ".[dev,sketch]"
      - run: python -m ruff check .
      - name: Full suite with fresh temporary roots
        run: |
          mkdir -p "$RUNNER_TEMP/release-tests-$GITHUB_RUN_ATTEMPT"
          export TMP="$RUNNER_TEMP/release-tests-$GITHUB_RUN_ATTEMPT"
          export TEMP="$TMP" TMPDIR="$TMP"
          python -m pytest -q --basetemp "$TMP/pytest"
  build:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, windows-x64]
    env:
      RELEASE_INPUTS_URL: ${{ vars.RELEASE_INPUTS_URL }}
      RELEASE_INPUTS_SHA256: ${{ vars.RELEASE_INPUTS_SHA256 }}
      RELEASE_INPUTS_BYTES: ${{ vars.RELEASE_INPUTS_BYTES }}
      TARGET: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/check_pipeline_source.py
      - name: Fetch pinned review configuration and build
        run: |
          python scripts/release_pipeline.py configure --commit "$SOURCE_COMMIT" --tag "$RELEASE_TAG" $CANDIDATE_FLAG --work "$RUNNER_TEMP/config.json"
          python scripts/release_pipeline.py build --commit "$SOURCE_COMMIT" --tag "$RELEASE_TAG" $CANDIDATE_FLAG --platform "$TARGET" --config "$RUNNER_TEMP/config.json" --work "$RUNNER_TEMP/$TARGET"
          cp "$RUNNER_TEMP/config.json" "$RUNNER_TEMP/$TARGET/config.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: built-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/${{ matrix.platform }}/candidate.zip
            ${{ runner.temp }}/${{ matrix.platform }}/build.json
            ${{ runner.temp }}/${{ matrix.platform }}/materials.json
            ${{ runner.temp }}/${{ matrix.platform }}/config.json
  native:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: windows-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-${{ matrix.platform }}
          path: ${{ runner.temp }}/${{ matrix.platform }}
      - run: python scripts/check_pipeline_source.py
      - name: Qualify exact archive in independent native Blender processes
        run: python scripts/release_pipeline.py qualify --commit "$SOURCE_COMMIT" --tag "$RELEASE_TAG" $CANDIDATE_FLAG --platform "$TARGET" --config "$RUNNER_TEMP/$TARGET/config.json" --work "$RUNNER_TEMP/$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qualified-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/${{ matrix.platform }}/candidate.zip
            ${{ runner.temp }}/${{ matrix.platform }}/build.json
            ${{ runner.temp }}/${{ matrix.platform }}/materials.json
            ${{ runner.temp }}/${{ matrix.platform }}/config.json
            ${{ runner.temp }}/${{ matrix.platform }}/native/summary.json
            ${{ runner.temp }}/${{ matrix.platform }}/native/host.json
            ${{ runner.temp }}/${{ matrix.platform }}/native/receipts
            ${{ runner.temp }}/${{ matrix.platform }}/native/logs
  publish:
    needs: [regression, build, native]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualified-linux-x64
          path: ${{ runner.temp }}/release/linux-x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualified-windows-x64
          path: ${{ runner.temp }}/release/windows-x64
      - run: python scripts/check_pipeline_source.py
      - name: Refresh remote refs and admit both exact archives
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          python scripts/release_pipeline.py admit --commit "$SOURCE_COMMIT" --tag "$RELEASE_TAG" $CANDIDATE_FLAG --work "$RUNNER_TEMP/release"
      - name: Publish once with built-in token
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py --work "$RUNNER_TEMP/release"
